<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS Vita Save Sync</title>
<style>
  :root {
    --bg: #070b14;
    --bg-2: #0b1222;
    --surface: #111a2e;
    --surface-2: #17223a;
    --line: #22304d;
    --text: #e8eefc;
    --muted: #8492b0;
    --faint: #56627e;
    --blue: #2f7bff;
    --blue-2: #5aa0ff;
    --cyan: #3fd6ff;
    --green: #3ddc97;
    --amber: #ffb547;
    --red: #ff5d6c;
    --radius: 16px;
    --font: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(47,123,255,.18), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(63,214,255,.10), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 14px/1.45 var(--font);
    overflow: hidden;
    user-select: none;
    display: flex; flex-direction: column;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input { font: inherit; color: inherit; }

  /* ---------- marca ---------- */
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 4px 0; }
  .brand .name { font-weight: 650; font-size: 15px; letter-spacing: .2px; flex: 1; }
  .brand .name span { color: var(--muted); font-weight: 400; }
  .icon-btn { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); border: 1px solid transparent; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--line); }
  .logo {
    width: 22px; height: 22px; border-radius: 50%;
    background: conic-gradient(from 200deg, var(--blue), var(--cyan), var(--blue));
    box-shadow: 0 0 14px rgba(63,214,255,.5);
    position: relative;
  }
  .logo::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--bg); }

  /* ---------- layout ---------- */
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 14px 16px 16px; }
  .side { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; }
  .side::-webkit-scrollbar { width: 0; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 270px 1fr; gap: 12px; }
    .mode span { display: none; }
    .search { width: 150px; }
  }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,.025), transparent), var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 16px;
  }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }

  /* ligação */
  .conn-row { display: grid; grid-template-columns: 1fr 86px; gap: 8px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field small { color: var(--faint); font-size: 11px; }
  .field input {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; outline: none; width: 100%; font-family: var(--mono); font-size: 13px;
    transition: border-color .15s, box-shadow .15s;
  }
  .field select { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; outline: none; width: 100%; font: inherit; font-size: 13px; color: var(--text); }
  .field select:focus { border-color: var(--blue); }
  .field input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47,123,255,.2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.busy { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: pulse 1s infinite; }
  .dot.err { background: var(--red); box-shadow: 0 0 8px var(--red); }
  @keyframes pulse { 50% { opacity: .35; } }

  /* modos */
  .modes { display: flex; flex-direction: column; gap: 6px; }
  .mode {
    display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left;
    padding: 9px 10px; border-radius: 12px; border: 1px solid transparent; transition: background .15s, border-color .15s;
  }
  .mode:hover { background: var(--surface-2); }
  .mode .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-2); color: var(--muted); }
  .mode b { display: block; font-weight: 600; font-size: 13.5px; }
  .mode span { color: var(--muted); font-size: 12px; }
  .mode.on { background: rgba(47,123,255,.12); border-color: rgba(47,123,255,.45); }
  .mode.on .ic { background: var(--blue); color: #fff; box-shadow: 0 0 16px rgba(47,123,255,.55); }

  /* botão principal */
  .sync { margin-top: auto; }
  .sync-btn {
    width: 100%; height: 54px; border-radius: 14px; font-weight: 600; font-size: 15px; letter-spacing: .3px;
    background: linear-gradient(135deg, var(--blue), #1f5fe0 60%, #1748b8);
    box-shadow: 0 10px 30px -10px rgba(47,123,255,.8), inset 0 1px 0 rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform .1s, filter .15s;
  }
  .sync-btn:hover { filter: brightness(1.1); }
  .sync-btn:active { transform: scale(.985); }
  .sync-btn:disabled { filter: grayscale(.6) brightness(.7); cursor: default; }
  .sync-btn svg { transition: transform .3s; }
  .sync-btn.spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress { height: 4px; background: var(--bg-2); border-radius: 4px; overflow: hidden; margin-top: 12px; }
  .progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--cyan)); transition: width .25s; }
  .status { margin-top: 8px; font-size: 12.5px; color: var(--muted); min-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status.err { color: var(--red); white-space: normal; }
  .status.ok { color: var(--green); }

  /* ---------- painel dos jogos ---------- */
  .main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .main-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .main-head h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -.2px; }
  .main-head h1 small { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 6px; }
  .main-head .grow { flex: 1; }
  .search {
    display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; width: 220px; color: var(--muted);
  }
  .search input { background: none; border: 0; outline: none; flex: 1; min-width: 0; }
  .chips { display: flex; gap: 6px; }
  .chip { padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
  .chip.on { color: var(--text); border-color: var(--blue); background: rgba(47,123,255,.15); }
  .chip .n { margin-left: 4px; color: var(--amber); font-weight: 600; }
  .ghost { color: var(--muted); padding: 6px 8px; border-radius: 8px; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; }
  .ghost:hover { color: var(--text); background: var(--surface-2); }

  .grid-wrap { flex: 1; min-height: 0; overflow-y: auto; padding-right: 4px; margin-right: -4px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #2c3d62; }
  ::-webkit-scrollbar-button { display: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 12px; }
  .game {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    display: flex; flex-direction: column; transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .grid.intro .game { animation: rise .3s both; }
  .game:hover { transform: translateY(-2px); border-color: #2c3d62; box-shadow: 0 12px 30px -14px rgba(0,0,0,.8); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .art { aspect-ratio: 144 / 80; background: var(--bg-2); position: relative; overflow: hidden; }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .art .ph {
    position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-weight: 700;
    font-size: 20px; color: rgba(255,255,255,.75); letter-spacing: 1px;
  }
  .badge {
    position: absolute; top: 8px; right: 8px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
    backdrop-filter: blur(8px); background: rgba(7,11,20,.7); border: 1px solid rgba(255,255,255,.08); display: flex; gap: 5px; align-items: center;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.synced { color: var(--green); }
  .badge.downloaded { color: var(--cyan); }
  .badge.uploaded { color: var(--blue-2); }
  .badge.conflict { color: var(--amber); }
  .badge.error { color: var(--red); }
  .badge.busy { color: var(--muted); }
  .badge.busy::before { animation: pulse 1s infinite; }
  .meta { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .meta .t { font-weight: 600; font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta .s { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .row { margin-top: auto; padding-top: 8px; display: flex; justify-content: space-between; color: var(--faint); font-size: 11px; gap: 8px; }
  .meta .row code { font-family: var(--mono); }
  .resolve { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 12px 12px; }
  .resolve p { grid-column: 1 / -1; margin: 0 0 2px; color: var(--amber); font-size: 11.5px; }
  .resolve button { padding: 7px 6px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; font-weight: 600; }
  .resolve button:hover { border-color: var(--amber); }
  .resolve button small { display: block; font-weight: 400; color: var(--muted); font-size: 10.5px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

  /* ---------- registo ---------- */
  .log { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); flex: none; }
  .log-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; color: var(--muted); font-size: 12px; width: 100%; }
  .log-head .chev { margin-left: auto; transition: transform .2s; }
  .log.open .chev { transform: rotate(180deg); }
  .log-body { height: 0; overflow: auto; font-family: var(--mono); font-size: 11.5px; transition: height .2s; user-select: text; }
  .log.open .log-body { height: 130px; border-top: 1px solid var(--line); }
  .log-body div { padding: 2px 12px; color: var(--muted); white-space: pre-wrap; }
  .log-body div time { color: var(--faint); margin-right: 8px; }
  .log-body .warn { color: var(--amber); }
  .log-body .error { color: var(--red); }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px;
    box-shadow: 0 20px 40px -10px rgba(0,0,0,.7); transition: all .25s; display: flex; gap: 10px; align-items: center; font-size: 13px;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .where { position: absolute; left: 8px; bottom: 8px; padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 600;
    background: rgba(7,11,20,.75); color: var(--cyan); border: 1px solid rgba(63,214,255,.35); backdrop-filter: blur(8px); }
  .game.vita-only .art img { filter: saturate(.7) brightness(.85); }

  /* ---------- definições ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(3,6,12,.65); backdrop-filter: blur(4px); display: none; place-items: center; z-index: 10; padding: 20px; }
  .overlay.show { display: grid; animation: fade .15s; }
  @keyframes fade { from { opacity: 0; } }
  .dialog { width: min(560px, 100%); max-height: 100%; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.9); }
  .dialog h2 { margin: 0 0 4px; font-size: 18px; }
  .dialog > p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .set { margin-bottom: 16px; }
  .set .field input { font-size: 12.5px; }
  .set-row { display: flex; gap: 8px; }
  .set-row .field { flex: 1; }
  .btn { padding: 9px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .btn:hover { border-color: var(--blue); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); }
  .set .err { color: var(--red); font-size: 12px; margin-top: 5px; display: none; }
  .set.bad .err { display: block; }
  .set.bad input { border-color: var(--red); }
  .found { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .found button { text-align: left; padding: 8px 10px; border-radius: 9px; background: var(--bg-2); border: 1px solid var(--line); font-size: 12px; display: flex; justify-content: space-between; gap: 10px; }
  .found button:hover { border-color: var(--blue); }
  .found button code { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .found button span { color: var(--muted); flex: none; }
  .found .none { color: var(--faint); font-size: 12px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }

  /* ---------- vistas ---------- */
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view[hidden] { display: none; }
  .game { cursor: pointer; }
  .count-pill { position: absolute; left: 8px; top: 8px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
    background: rgba(7,11,20,.7); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(8px); }

  /* ---------- página do jogo ---------- */
  .hero { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); margin-bottom: 14px; min-height: 190px; display: flex; flex-direction: column; }
  .hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .55; transition: background-image .3s; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,11,20,.15) 0%, rgba(11,18,34,.92) 78%); }
  .back { position: relative; z-index: 1; align-self: flex-start; margin: 12px; padding: 6px 12px 6px 8px; border-radius: 999px; display: flex; gap: 4px; align-items: center;
    background: rgba(7,11,20,.6); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(8px); font-size: 12.5px; font-weight: 600; }
  .back:hover { background: rgba(7,11,20,.85); }
  .hero-body { position: relative; z-index: 1; margin-top: auto; display: flex; align-items: flex-end; gap: 16px; padding: 18px; flex-wrap: wrap; }
  .hero-icon { width: 144px; aspect-ratio: 144/80; border-radius: 10px; overflow: hidden; flex: none; box-shadow: 0 10px 30px -8px rgba(0,0,0,.8); border: 1px solid rgba(255,255,255,.12); background: var(--bg-2); }
  .hero-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-text { flex: 1; min-width: 200px; }
  .hero-text code { font-family: var(--mono); font-size: 11.5px; color: var(--cyan); letter-spacing: .5px; }
  .hero-text h2 { margin: 2px 0 6px; font-size: 24px; font-weight: 700; letter-spacing: -.3px; line-height: 1.15; }
  .hero-stats { display: flex; gap: 14px; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
  .hero-stats b { color: var(--text); font-weight: 600; }

  .saves { display: flex; flex-direction: column; gap: 10px; }
  .save { display: grid; grid-template-columns: 112px 1fr auto; gap: 14px; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); animation: rise .25s both; }
  .save .thumb { width: 112px; aspect-ratio: 144/80; border-radius: 8px; overflow: hidden; background: var(--bg-2); position: relative; }
  .save .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .save .info { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .save .name { font-weight: 650; font-size: 14.5px; }
  .save .detail { color: var(--text); opacity: .85; font-size: 12.5px; white-space: pre-line; line-height: 1.5;
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin-top: 4px; align-self: flex-start; max-width: 100%; }
  .save .sub { color: var(--faint); font-size: 11.5px; display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
  .save .sub code { font-family: var(--mono); color: var(--muted); }
  .save .side-col { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .save .badge { position: static; }
  .save .resolve { padding: 0; grid-column: 1 / -1; grid-template-columns: repeat(2, minmax(0, 200px)); }
  .save details { grid-column: 1 / -1; }
  .save details summary { margin: 0; font-size: 12px; }
  .files { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 2px 16px; margin-top: 8px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .files div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding: 3px 0; }
  .files span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* ---------- ligação ---------- */
  .conn-actions { display: flex; gap: 6px; margin-top: 10px; }
  .btn.small { padding: 6px 10px; font-size: 12px; border-radius: 9px; flex: 1; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.danger:hover { border-color: var(--red); color: var(--red); }
  .conn-msg { margin-top: 10px; color: var(--faint); font-size: 12px; }
  .conn-msg.ok { color: var(--green); }
  .conn-msg.err { color: var(--red); }
  #vitaFound button code { font-size: 12px; }
  .speed { font-size: 11.5px; color: var(--faint); min-height: 16px; font-variant-numeric: tabular-nums; }

  /* ---------- pré-visualização ---------- */
  .dialog.wide { width: min(680px, 100%); }
  #cfText { white-space: pre-line; }
  .pv-tools { display: flex; gap: 4px; margin: -8px 0 8px -8px; }
  .pv-count { margin-right: auto; align-self: center; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .pv-block { border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); overflow: hidden; flex: none; }
  .pv-game { display: grid; grid-template-columns: 20px 64px 1fr; gap: 10px; align-items: center; padding: 8px 10px; cursor: pointer; background: rgba(255,255,255,.02); }
  .pv-game img, .pv-game .noimg { width: 64px; aspect-ratio: 144/80; border-radius: 6px; object-fit: cover; background: var(--surface-2); }
  .pv-game b { display: block; font-size: 13.5px; }
  .pv-game span { color: var(--muted); font-size: 11.5px; }
  .pv-save { display: grid; grid-template-columns: 20px 26px 1fr auto; gap: 10px; align-items: center; padding: 7px 10px 7px 10px; border-top: 1px solid var(--line); cursor: pointer; }
  div.pv-save { cursor: default; }
  .pv-save:hover { background: rgba(255,255,255,.025); }
  .pv-save .dir { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .pv-save .dir.down { background: rgba(63,214,255,.15); color: var(--cyan); }
  .pv-save .dir.up { background: rgba(90,160,255,.15); color: var(--blue-2); }
  .pv-save .dir.conflict { background: rgba(255,181,71,.15); color: var(--amber); }
  .pv-text { min-width: 0; }
  .pv-text b { display: block; font-size: 12.5px; font-weight: 600; }
  .pv-text span { display: block; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pv-save .sz { color: var(--faint); font-size: 11.5px; font-family: var(--mono); }
  .pv-list input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--blue); margin: 0; cursor: pointer; }
  .cb-space { width: 16px; }
  .seg { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
  .seg button { padding: 4px 10px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--muted); line-height: 1.2; }
  .seg button small { display: block; font-weight: 400; font-size: 10px; color: var(--faint); }
  .seg button.on { background: var(--amber); color: #1a1205; }
  .seg button.on small { color: rgba(26,18,5,.7); }
  .seg button:not(.on):hover { color: var(--text); background: var(--surface-2); }
  @media (max-width: 700px) { .pv-save { grid-template-columns: 20px 26px 1fr; } .pv-save .seg, .pv-save .sz { grid-column: 3; justify-self: start; } }
  .radios { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .radio { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); cursor: pointer; }
  .radio:has(input:checked) { border-color: var(--blue); background: rgba(47,123,255,.1); }
  .radio input { accent-color: var(--blue); margin: 2px 0 0; }
  .radio b { display: block; font-size: 13px; }
  .radio span { color: var(--muted); font-size: 12px; }
  .pv-list { display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow: auto; }

  /* ---------- backups ---------- */
  .back.flat { margin: 0; background: var(--surface); border-color: var(--line); }
  .note { color: var(--muted); font-size: 12.5px; margin: -4px 0 12px; }
  .sessions { display: flex; flex-direction: column; gap: 10px; }
  .session { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .session-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .session-head b { font-size: 14px; }
  .session-head .tag { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
  .session-head .grow { flex: 1; }
  .session-head .sz { color: var(--faint); font-size: 12px; font-family: var(--mono); }
  .bk-rows { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .bk-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 8px; background: var(--bg-2); font-size: 12.5px; }
  .bk-row .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bk-row .who code { font-family: var(--mono); color: var(--faint); margin-left: 6px; font-size: 11px; }
  .bk-row .side { color: var(--muted); font-size: 11.5px; }

  /* ---------- extras no save ---------- */
  .save.excluded { opacity: .55; }
  .save.excluded:hover { opacity: .85; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .toggle input { appearance: none; width: 30px; height: 17px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
  .toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
  .toggle input:checked { background: var(--blue); border-color: var(--blue); }
  .toggle input:checked::after { transform: translateX(13px); background: #fff; }
  .extras { grid-column: 1 / -1; display: flex; gap: 16px; flex-wrap: wrap; }
  .extras details { flex: 1; min-width: 220px; }
  .hist, .bks { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; font-size: 12px; }
  .hist div, .bks div { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 4px 8px; border-radius: 7px; background: var(--bg-2); }
  .hist span:first-child, .bks span:first-child { color: var(--faint); font-variant-numeric: tabular-nums; }
  .bks button { padding: 3px 9px; font-size: 11.5px; }
  .badge.excluded { color: var(--faint); }
  .badge.plan_down { color: var(--cyan); }
  .badge.plan_up { color: var(--blue-2); }

  @media (max-width: 900px) { .save { grid-template-columns: 84px 1fr; } .save .thumb { width: 84px; } .save .side-col { grid-column: 1 / -1; flex-direction: row; align-items: center; } }
</style>

<script src="i18n.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const api = () => window.pywebview.api;

const state = {
  mode: "auto",
  games: new Map(),     // id do save -> info (título, ícone…)
  results: new Map(),   // id do save -> resultado da última sincronização
  excluded: new Set(),
  filter: "all",
  query: "",
  busy: false,
  view: "library",      // library | game | backups
  openGame: null,
  details: {},          // id do save -> {files, size, pic, history, backups}
  lastSync: null,
};
let config = {};
// Mensagens atuais guardadas como chave + parâmetros, para se poderem traduzir de novo
// quando o idioma muda.
let statusMsg = { key: "ready", args: {}, cls: "" };
let connMsgState = { key: "conn_hint", args: {}, cls: "", html: true };

/* ---------- formatação ---------- */
function fmtDate(ts) {
  if (!ts) return "—";
  const d = new Date(ts * 1000);
  return d.toLocaleDateString(locale(), { day: "2-digit", month: "short" }) + " " +
         d.toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit" });
}
function fmtDateLong(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleDateString(locale(), { weekday: "short", day: "2-digit", month: "long", year: "numeric" }) +
         " · " + d.toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit" });
}
function fmtLastSync() {
  return state.lastSync ? t("last_sync", { date: fmtDate(new Date(state.lastSync).getTime() / 1000) }) : t("never_synced");
}
function fmtSize(n) {
  if (n == null) return "—";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
function fmtEta(s) {
  if (s == null || !isFinite(s)) return "";
  if (s < 60) return `~${Math.max(1, Math.round(s))} s`;
  return `~${Math.floor(s / 60)} min ${String(Math.round(s % 60)).padStart(2, "0")} s`;
}
const modeName = (m) => ({ auto: t("mode_auto"), vita_to_pc: "Vita → PC", pc_to_vita: "PC → Vita" })[m] || m;
function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function img(src) { return Object.assign(el("img"), { src, alt: "" }); }
const gameCode = (id) => (id.match(/^[A-Z]{4}\d{5}/) || [id])[0];
const saveName = (id) => { const s = state.games.get(id); return s ? (s.title || id) + (s.subtitle ? " · " + s.subtitle : "") : id; };
const statusText = (st) => t("st_" + st);
const PRIORITY = ["busy", "conflict", "error", "downloaded", "uploaded", "plan_down", "plan_up", "synced", "excluded"];

/* ---------- idioma ---------- */
function setLanguage(setting) {
  LANG = pickLanguage(setting);
  applyStaticI18n();
  $("syncLabel").textContent = state.busy ? t("syncing") : t("sync");
  setStatus(statusMsg.key, statusMsg.args, statusMsg.cls);
  connMsg(connMsgState.key, connMsgState.args, connMsgState.cls);
  $("lastSync").textContent = fmtLastSync();
  const sel = $("langSelect");
  sel.replaceChildren(new Option(t("lang_auto"), ""), ...Object.entries(LANGS).map(([k, v]) => new Option(v.name, k)));
  sel.value = config.language || "";
  render();
  if (state.view === "backups") openBackups();
}

/* ---------- vistas ---------- */
function showView(v) {
  state.view = v;
  $("libraryView").hidden = v !== "library";
  $("gameView").hidden = v !== "game";
  $("backupsView").hidden = v !== "backups";
  if (v !== "game") state.openGame = null;
}

/* ---------- agrupar saves por jogo ---------- */
function groups() {
  const map = new Map();
  const ids = new Set([...state.games.keys(), ...state.results.keys()]);
  for (const id of ids) {
    const s = state.games.get(id) ||
      { id, game: gameCode(id), title: "", subtitle: "", detail: "", icon: null, modified: null, where: "vita" };
    const code = s.game || gameCode(id);
    if (!map.has(code)) map.set(code, { code, saves: [] });
    map.get(code).saves.push(s);
  }
  for (const g of map.values()) {
    g.saves.sort((a, b) => a.id.localeCompare(b.id));
    g.title = g.saves.find((s) => s.title)?.title || g.code;
    g.icon = (g.saves.find((s) => s.icon && s.where === "pc") || g.saves.find((s) => s.icon))?.icon;
    g.modified = Math.max(0, ...g.saves.map((s) => s.modified || 0)) || null;
    g.vitaOnly = g.saves.every((s) => s.where === "vita");
    g.allExcluded = g.saves.every((s) => state.excluded.has(s.id));
    const sts = g.saves.map((s) => state.results.get(s.id)?.status).filter(Boolean);
    g.status = PRIORITY.find((p) => sts.includes(p)) || (g.allExcluded ? "excluded" : null);
    g.conflicts = sts.filter((s) => s === "conflict").length;
    g.changed = sts.some((s) => s === "downloaded" || s === "uploaded");
  }
  return [...map.values()].sort((a, b) => a.title.localeCompare(b.title, locale()));
}

function artFor(code, icon) {
  const art = el("div", "art");
  if (icon) art.append(img(icon));
  else {
    const h = hue(code);
    art.style.background = `linear-gradient(135deg, hsl(${h} 70% 35%), hsl(${(h + 60) % 360} 70% 22%))`;
    art.append(el("div", "ph", code.slice(0, 4)));
  }
  return art;
}

/* ---------- grelha de jogos ---------- */
let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

function render() {
  if (state.view === "game") renderGame();
  const grid = $("grid");
  grid.replaceChildren();
  const all = groups();
  const q = state.query.toLowerCase();
  let shown = 0, conflicts = 0;

  for (const g of all) {
    conflicts += g.conflicts;
    if (state.filter === "changed" && !g.changed) continue;
    if (state.filter === "conflict" && !g.conflicts) continue;
    const hay = [g.title, g.code, ...g.saves.flatMap((s) => [s.id, s.subtitle, s.detail])].join(" ").toLowerCase();
    if (q && !hay.includes(q)) continue;
    shown++;
    grid.append(card(g));
  }

  $("count").textContent = `${all.length} · ${tn("n_saves", state.games.size)}`;
  $("conflictN").textContent = conflicts ? conflicts : "";
  if (!shown) {
    const e = el("div", "empty");
    e.style.gridColumn = "1 / -1";
    e.append(el("b", null, t(all.length ? "empty_filter_title" : "empty_none_title")),
             el("span", null, t(all.length ? "empty_filter_text" : "empty_none_text")));
    grid.append(e);
  }
}

function card(g) {
  const c = el("article", "game");
  if (g.allExcluded) c.style.opacity = ".55";
  const art = artFor(g.code, g.icon);
  if (g.status) art.append(el("div", `badge ${g.status}`,
    g.status === "conflict" && g.conflicts > 1 ? tn("n_conflicts", g.conflicts) : statusText(g.status)));
  if (g.saves.length > 1) art.append(el("div", "count-pill", tn("n_saves", g.saves.length)));
  if (g.vitaOnly) { art.append(el("div", "where", t("vita_only"))); c.classList.add("vita-only"); }
  c.append(art);

  const meta = el("div", "meta");
  meta.append(el("div", "t", g.title));
  const s = g.saves.length === 1 ? (g.saves[0].subtitle || g.saves[0].detail.split("\n")[0])
                                 : g.saves.map((x) => x.subtitle || x.id).join(" · ");
  meta.append(el("div", "s", s || ""));
  const row = el("div", "row");
  row.append(el("code", null, g.code), el("span", null, fmtDate(g.modified)));
  meta.append(row);
  c.append(meta);
  c.onclick = () => openGame(g.code);
  return c;
}

/* ---------- página de um jogo ---------- */
function openGame(code) {
  showView("game");
  state.openGame = code;
  $("gameScroll").scrollTop = 0;
  renderGame(true);
  loadDetails();
}

function closeGame() { showView("library"); render(); }

async function loadDetails(force = false) {
  const g = groups().find((x) => x.code === state.openGame);
  if (!g) return;
  const want = g.saves.map((s) => s.id).filter((id) => force || !(id in state.details));
  if (!want.length) return;
  Object.assign(state.details, await api().get_save_details(want));
  if (state.openGame === g.code) renderGame();
}

function renderGame(animate = false) {
  const g = groups().find((x) => x.code === state.openGame);
  if (!g) { closeGame(); return; }

  const pic = g.saves.map((s) => state.details[s.id]?.pic).find(Boolean);
  if (pic) { $("heroBg").style.background = ""; $("heroBg").style.backgroundImage = `url(${pic})`; }
  else {
    const h = hue(g.code);
    $("heroBg").style.background = `radial-gradient(600px 300px at 20% 0%, hsl(${h} 70% 30%), transparent), var(--surface)`;
  }
  $("heroIcon").replaceChildren(...(g.icon ? [img(g.icon)] : []));
  $("heroCode").textContent = g.code;
  $("heroTitle").textContent = g.title;

  const sizes = g.saves.map((s) => state.details[s.id]?.size).filter((x) => x != null);
  const onPc = g.saves.filter((s) => s.where === "pc").length;
  const stats = [
    [tn("n_saves", g.saves.length), ""],
    [sizes.length ? fmtSize(sizes.reduce((a, b) => a + b, 0)) : "…", t("on_pc")],
    [fmtDate(g.modified), t("last_change")],
  ];
  if (onPc < g.saves.length) stats.push([String(g.saves.length - onPc), t("vita_only_lower")]);
  $("heroStats").replaceChildren(...stats.map(([b, txt]) => { const s = el("span"); s.append(el("b", null, b), txt ? " " + txt : ""); return s; }));

  $("saves").replaceChildren(...g.saves.map((s, i) => saveRow(s, animate ? i : -1)));
  $("btnSyncGame").disabled = state.busy || g.allExcluded;
}

function saveRow(s, i) {
  const r = state.results.get(s.id);
  const d = state.details[s.id];
  const excluded = state.excluded.has(s.id);
  const row = el("article", "save" + (excluded ? " excluded" : ""));
  if (i < 0) row.style.animation = "none"; else row.style.animationDelay = `${i * 40}ms`;

  const thumb = el("div", "thumb");
  if (s.icon) thumb.append(img(s.icon));
  row.append(thumb);

  const info = el("div", "info");
  info.append(el("div", "name", s.subtitle || s.id));
  if (s.detail) info.append(el("div", "detail", s.detail));
  const sub = el("div", "sub");
  sub.append(el("code", null, s.id));
  sub.append(el("span", null, s.where === "vita" ? t("vita_only") : t("on_pc_date", { date: fmtDate(s.modified) })));
  if (d?.size != null) sub.append(el("span", null, `${fmtSize(d.size)} · ${tn("n_files", d.files.length)}`));
  info.append(sub);
  row.append(info);

  const side = el("div", "side-col");
  const status = r?.status || (excluded ? "excluded" : null);
  if (status) side.append(el("div", `badge ${status}`, statusText(status)));
  const tg = el("label", "toggle");
  const cb = Object.assign(el("input"), { type: "checkbox", checked: !excluded });
  cb.onchange = async () => {
    state.excluded = new Set(await api().set_excluded(s.id, !cb.checked));
    render();
  };
  tg.append(cb, t("sync"));
  side.append(tg);
  if (s.where === "pc") {
    const b = el("button", "ghost");
    b.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
    b.append(t("open_folder"));
    b.onclick = () => api().open_save_folder(s.id);
    side.append(b);
  }
  row.append(side);

  if (r?.status === "conflict") {
    const box = el("div", "resolve");
    box.append(el("p", null, t("conflict_text")));
    const bv = el("button"); bv.append(t("keep_vita"), el("small", null, fmtDate(r.vita_date)));
    const bp = el("button"); bp.append(t("keep_pc"), el("small", null, fmtDate(r.pc_date)));
    bv.onclick = () => startSync("vita_to_pc", [s.id]);
    bp.onclick = () => startSync("pc_to_vita", [s.id]);
    bv.disabled = bp.disabled = state.busy;
    box.append(bv, bp);
    row.append(box);
  } else if (r?.status === "error") {
    info.append(el("div", "sub", r.detail));
  }

  const extras = el("div", "extras");
  if (d?.files?.length) {
    const det = el("details");
    det.append(el("summary", null, t("files_title", { n: d.files.length })));
    const files = el("div", "files");
    for (const f of d.files) { const x = el("div"); x.append(el("span", null, f.name), el("span", null, fmtSize(f.size))); files.append(x); }
    det.append(files);
    extras.append(det);
  }
  if (d) {
    const hist = el("details");
    hist.append(el("summary", null, t("history_title", { n: d.history.length })));
    const h = el("div", "hist");
    if (!d.history.length) h.append(el("div", null, t("no_history")));
    for (const e of d.history) {
      const x = el("div");
      x.append(el("span", null, fmtDate(e.t)),
               el("span", null, t("act_" + e.action) + (e.files ? ` (${tn("n_files", e.files)})` : "")));
      h.append(x);
    }
    hist.append(h);
    extras.append(hist);

    const bk = el("details");
    bk.append(el("summary", null, t("backups_title", { n: d.backups.length })));
    const b = el("div", "bks");
    if (!d.backups.length) b.append(el("div", null, t("no_backups_save")));
    for (const e of d.backups) {
      const x = el("div");
      const btn = el("button", "btn", t("restore"));
      btn.disabled = state.busy;
      btn.onclick = () => askRestore(e.session, e.side, s.id, e.time);
      x.append(el("span", null, fmtDate(e.time)), el("span", null, `${t("side_" + e.side)} · ${fmtSize(e.size)}`), btn);
      b.append(x);
    }
    bk.append(b);
    extras.append(bk);
  }
  if (extras.children.length) row.append(extras);
  return row;
}

function setGames(list) { state.games = new Map(list.map((g) => [g.id, g])); }

/* ---------- confirmação genérica ---------- */
let confirmCb = null;
function ask(title, text, yes, cb) {
  $("cfTitle").textContent = title;
  $("cfText").textContent = text;
  $("cfYes").textContent = yes;
  confirmCb = cb;
  $("confirm").classList.add("show");
}
const closeConfirm = () => { $("confirm").classList.remove("show"); confirmCb = null; };
$("cfNo").onclick = closeConfirm;
$("cfYes").onclick = () => { const cb = confirmCb; closeConfirm(); cb && cb(); };

/* ---------- backups ---------- */
const errText = (res) => t("error_prefix", { msg: t(res.key, res.args || {}) });

function askRestore(session, side, saveId, time) {
  ask(t("restore_q"), t("restore_text", { save: saveName(saveId), date: fmtDate(time) }), t("restore_btn"),
      async () => {
        const res = await api().restore_backup(session, side, saveId);
        if (!res.ok) { toast(errText(res)); return; }
        setGames(res.games);
        state.details = {};
        toast(t("restored"));
        if (state.view === "game") loadDetails(true);
        if (state.view === "backups") openBackups();
        render();
      });
}

async function openBackups() {
  showView("backups");
  const { sessions, keep } = await api().list_backups();
  const total = sessions.reduce((a, s) => a + s.size, 0);
  $("backupsCount").textContent = `${sessions.length} · ${fmtSize(total)}`;
  $("backupsNote").textContent = keep ? t("backups_note_keep", { n: keep }) : t("backups_note_all");
  const box = $("sessions");
  box.replaceChildren();
  if (!sessions.length) {
    const e = el("div", "empty"); e.append(el("b", null, t("no_backups_title")), el("span", null, t("no_backups_text")));
    box.append(e);
  }
  for (const s of sessions) {
    const card = el("section", "session");
    const head = el("div", "session-head");
    head.append(el("b", null, fmtDateLong(s.time)));
    if (s.legacy) head.append(el("span", "tag", t("legacy_tag")));
    head.append(el("div", "grow"), el("span", "sz", `${tn("n_saves", s.entries.length)} · ${fmtSize(s.size)}`));
    const del = el("button", "btn small danger", t("delete"));
    del.style.flex = "none";
    del.onclick = () => ask(t("delete_q"),
      t("delete_text", { date: fmtDateLong(s.time), saves: tn("n_saves", s.entries.length), size: fmtSize(s.size) }), t("delete"),
      async () => { const r = await api().delete_backup(s.id); r.ok ? openBackups() : toast(errText(r)); });

    for (const e of s.entries) {

      r.append(who, el("span", "side", `${t("side_" + e.side)} · ${fmtSize(e.size)}`), btn);
      rows.append(r);
    }
    card.append(rows);
    box.append(card);

}

/* ---------- sincronização ---------- */
function setMode(m) {
  state.mode = m;
  document.querySelectorAll(".mode").forEach((b) => b.classList.toggle("on", b.dataset.mode === m));
}

function setBusy(b, labelKey = "syncing") {
  state.busy = b;
  $("syncBtn").disabled = b;
  $("syncBtn").classList.toggle("spin", b);
  $("syncLabel").textContent = b ? t(labelKey) : t("sync");
  $("connDot").className = "dot" + (b ? " busy" : "");
  document.querySelectorAll(".resolve button, .mode, #ip, #port, #btnSyncGame, #btnTest, #btnFind, .bks button, .bk-row button")
    .forEach((e) => (e.disabled = b));
  if (!b) $("speed").textContent = "";
}

// status guarda chave + parâmetros (ou um texto já pronto em args.text) para poder ser retraduzido
function setStatus(key, args = {}, cls = "") {
  statusMsg = { key, args, cls };
  $("status").textContent = key ? t(key, args) : args.text;
  $("status").className = "status " + cls;
}

function conn() {
  const ip = $("ip").value.trim(), port = $("port").value.trim() || "1337";
  if (!ip) { setStatus("need_ip", {}, "err"); $("ip").focus(); return null; }
  return { ip, port };
}

// 1.º passo: ver o que vai acontecer, sem copiar nada.
// Com "Copiar sem perguntar" nas definições, salta logo para a cópia.
async function preview(mode, only = null) {
  if (state.busy) return;
  if (config.confirm === "direct") return startSync(mode, only, 0, {}, true);
  const c = conn(); if (!c) return;
  setBusy(true, "analyzing");
  $("bar").style.width = "0";
  const ok = await api().start_sync(c.ip, c.port, mode, only, true, 0, {}, true);
  if (!ok) setBusy(false);
}

// 2.º passo (ou direto, ao resolver um conflito): copiar.
async function startSync(mode, only = null, expected = 0, overrides = {}, remember = false) {
  if (state.busy) return;
  const c = conn(); if (!c) return;
  if (only) only.forEach((id) => state.results.set(id, { status: "busy" }));
  else state.results.clear();
  render();
  setBusy(true);
  $("bar").style.width = "0";
  const ok = await api().start_sync(c.ip, c.port, mode, only, false, expected, overrides, remember);
  if (!ok) setBusy(false);
}

/* ---------- pré-visualização com escolha de saves ---------- */
// pv.items: saves a copiar ou em conflito; pv.sel: saves marcados; pv.choice: conflito -> vita | pc | skip
let pv = null;

function showPreview(s) {
  const items = Object.entries(s.games)
    .filter(([, r]) => ["plan_down", "plan_up", "conflict"].includes(r.status))
    .map(([id, r]) => ({ id, ...r }));
  // os conflitos ficam também visíveis na grelha, para os poderes resolver depois
  for (const it of items) if (it.status === "conflict") state.results.set(it.id, it);
  render();

  if (!items.length) {
    setStatus("nothing_to_copy", {}, "ok");
    toast(t("all_synced"));
    return;
  }
  const startChecked = config.confirm !== "unchecked";
  pv = {
    mode: s.mode, items, excluded: s.excluded,
    sel: new Set(startChecked ? items.filter((i) => i.status !== "conflict").map((i) => i.id) : []),
    choice: Object.fromEntries(items.filter((i) => i.status === "conflict").map((i) => [i.id, "skip"])),
  };
  renderPreview();
  $("preview").classList.add("show");
}

function pvSelected() {
  const ids = [...pv.sel];
  const overrides = {};
  for (const [id, c] of Object.entries(pv.choice)) {
    if (c === "skip") continue;
    ids.push(id);
    overrides[id] = c === "vita" ? "vita_to_pc" : "pc_to_vita";
  }
  let bytes = 0;
  for (const it of pv.items) {
    if (pv.sel.has(it.id)) bytes += (it.read || 0) + (it.bytes || 0);
    else if (pv.choice[it.id] && pv.choice[it.id] !== "skip")
      // "Vita": os ficheiros já foram lidos para comparar; "PC": envia o save do PC
      bytes += pv.choice[it.id] === "vita" ? Math.max(it.read || 0, it.size_vita) : (it.read || 0) + it.size_pc;
  }
  return { ids, overrides, bytes };
}

function updatePvFooter() {
  const { ids, bytes } = pvSelected();
  $("pvCount").textContent = ids.length ? t("pv_count", { n: ids.length, total: pv.items.length, size: fmtSize(bytes) }) : t("pv_nothing");
  $("pvGo").disabled = !ids.length;
  $("pvGo").textContent = ids.length ? tn("copy_n", ids.length) : t("copy");
  // estado das caixas de cada jogo (marcada / meio / vazia)
  document.querySelectorAll("#pvList .pv-game").forEach((head) => {
    const ids = JSON.parse(head.dataset.ids);
    const on = ids.filter((id) => pv.sel.has(id)).length;
    const cb = head.querySelector("input");
    if (!cb) return;
    cb.checked = on === ids.length && on > 0;
    cb.indeterminate = on > 0 && on < ids.length;
  });
}

function renderPreview() {
  const nd = pv.items.filter((i) => i.status === "plan_down").length;
  const nu = pv.items.filter((i) => i.status === "plan_up").length;
  const nc = pv.items.length - nd - nu;
  const bits = [];
  if (nd) bits.push(t("pv_down", { n: nd }));
  if (nu) bits.push(t("pv_up", { n: nu }));
  if (nc) bits.push(t("pv_conflicts", { n: nc }));
  if (pv.excluded) bits.push(t("pv_excluded", { n: pv.excluded }));
  $("pvSub").textContent = t("pv_sub", { mode: modeName(pv.mode), bits: bits.join(" · ") });

  const list = $("pvList");
  list.replaceChildren();
  // agrupar por jogo, pela mesma ordem da biblioteca
  const byGame = new Map();
  for (const it of pv.items) {
    const code = state.games.get(it.id)?.game || gameCode(it.id);
    if (!byGame.has(code)) byGame.set(code, []);
    byGame.get(code).push(it);
  }
  const all = groups();
  const order = all.map((g) => g.code);
  const codes = [...byGame.keys()].sort((a, b) => order.indexOf(a) - order.indexOf(b));

  for (const code of codes) {
    const its = byGame.get(code);
    const g = all.find((x) => x.code === code);
    const selectable = its.filter((i) => i.status !== "conflict").map((i) => i.id);
    const block = el("div", "pv-block");

    const head = el("label", "pv-game");
    head.dataset.ids = JSON.stringify(selectable);
    if (selectable.length) {
      const cb = Object.assign(el("input"), { type: "checkbox" });
      cb.onchange = () => { selectable.forEach((id) => cb.checked ? pv.sel.add(id) : pv.sel.delete(id)); renderPreview(); };
      head.append(cb);
    } else head.append(el("span", "cb-space"));
    head.append(g?.icon ? img(g.icon) : el("div", "noimg"));
    const ht = el("div");
    ht.append(el("b", null, g?.title || code), el("span", null, tn("n_saves", its.length)));
    head.append(ht);
    block.append(head);

    for (const it of its) {
      const s = state.games.get(it.id);
      const row = el(it.status === "conflict" ? "div" : "label", "pv-save");
      if (it.status === "conflict") {
        row.append(el("span", "cb-space"));
      } else {
        const cb = Object.assign(el("input"), { type: "checkbox", checked: pv.sel.has(it.id) });
        cb.onchange = () => { cb.checked ? pv.sel.add(it.id) : pv.sel.delete(it.id); updatePvFooter(); };
        row.append(cb);
      }
      const [cls, arrow] = { plan_down: ["down", "↓"], plan_up: ["up", "↑"], conflict: ["conflict", "!"] }[it.status];
      row.append(el("div", `dir ${cls}`, arrow));
      const tx = el("div", "pv-text");
      tx.append(el("b", null, s?.subtitle || it.id));
      if (it.status === "conflict") {
        tx.append(el("span", null, t("pv_changed_both")));
      } else {
        tx.append(el("span", null, (it.status === "plan_down" ? "Vita → PC · " : "PC → Vita · ") + it.files.map((f) => f.name).join(", ")));
      }
      row.append(tx);
      if (it.status === "conflict") {
        const seg = el("div", "seg");
        for (const [val, label, sub] of [["vita", "Vita", fmtDate(it.vita_date)], ["pc", "PC", fmtDate(it.pc_date)], ["skip", t("skip"), t("skip_sub")]]) {
          const b = el("button", pv.choice[it.id] === val ? "on" : "");
          b.append(label, el("small", null, sub));
          b.onclick = () => { pv.choice[it.id] = val; renderPreview(); };
          seg.append(b);
        }
        row.append(seg);
      } else {
        row.append(el("div", "sz", fmtSize(it.files.reduce((a, f) => a + f.size, 0))));
      }
      block.append(row);
    }
    list.append(block);
  }
  updatePvFooter();
}

$("pvAll").onclick = () => { pv.items.forEach((i) => i.status !== "conflict" && pv.sel.add(i.id)); renderPreview(); };
$("pvNone").onclick = () => { pv.sel.clear(); renderPreview(); };

const closePreview = () => $("preview").classList.remove("show");
$("pvCancel").onclick = () => { closePreview(); pv = null; setStatus("cancelled"); };
$("pvGo").onclick = () => {
  const { ids, overrides, bytes } = pvSelected();
  if (!ids.length) return;
  closePreview();
  const mode = pv.mode;
  pv = null;
  startSync(mode, ids, bytes, overrides, false);
};

/* ---------- registo e avisos ---------- */
function logText(ev) {
  const args = { ...ev.args };
  if (ev.key === "log_connecting") {
    args.mode = modeName(args.mode);
    return t("log_connecting", args) + (args.preview ? t("log_preview") : "");
  }
  return t(ev.key, args);
}

function addLog(text, level = "info", time = "") {
  const d = el("div", level);
  if (time) d.append(el("time", null, time));
  d.append(text);
  $("logBody").append(d);
  $("logBody").scrollTop = $("logBody").scrollHeight;
  $("logLast").textContent = "— " + text;
}

let toastT;
function toast(text) {
  const tt = $("toast"); tt.textContent = text; tt.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => tt.classList.remove("show"), 4000);
}

/* ---------- eventos vindos do Python (chave + parâmetros, traduzidos aqui) ---------- */
window.onSyncEvent = (ev) => {
  switch (ev.type) {
    case "status":
      setStatus(ev.key, ev.args);
      $("bar").style.width = Math.round(ev.progress * 100) + "%";
      break;
    case "transfer": {
      const parts = [`${fmtSize(ev.speed)}/s`];
      if (ev.expected) parts.push(t("speed_of", { done: fmtSize(Math.min(ev.bytes, ev.expected)), total: fmtSize(ev.expected) }));
      else parts.push(t("speed_transferred", { n: fmtSize(ev.bytes) }));
      if (ev.eta != null) parts.push(t("speed_left", { eta: fmtEta(ev.eta) }));
      $("speed").textContent = parts.join(" · ");
      break;
    }
    case "log":
      addLog(logText(ev), ev.level, ev.time);
      break;
    case "game":
      state.results.set(ev.id, ev);
      scheduleRender();   // vários saves seguidos -> um só redesenho por frame
      break;
    case "done": {
      const s = ev.summary;
      setGames(s.all_games);
      setBusy(false);
      $("connDot").className = "dot ok";
      if (s.dry_run) { showPreview(s); break; }
      state.details = {};          // ficheiros, histórico e backups podem ter mudado
      render();
      if (state.view === "game") loadDetails();
      if (state.view === "backups") openBackups();
      state.lastSync = s.last_sync;
      $("lastSync").textContent = fmtLastSync();
      const parts = [];
      if (s.downloaded) parts.push(tn("done_down", s.downloaded));
      if (s.uploaded) parts.push(tn("done_up", s.uploaded));
      if (s.conflicts.length) parts.push(tn("n_conflicts", s.conflicts.length));
      if (s.errors.length) parts.push(tn("done_errors", s.errors.length));
      if (parts.length) setStatus(null, { text: parts.join(" · ") }, s.conflicts.length || s.errors.length ? "" : "ok");
      else setStatus("all_synced", {}, "ok");
      toast($("status").textContent);
      if (s.conflicts.length && state.view === "library") setFilter("conflict");
      break;
    }
    case "error": {
      setBusy(false);
      $("connDot").className = "dot err";
      $("bar").style.width = "0";
      state.results.forEach((r, id) => r.status === "busy" && state.results.delete(id));
      render();
      setStatus(ev.key, ev.args, "err");
      addLog(t(ev.key, ev.args), "error");
      break;
    }
  }
};

function setFilter(f) {
  state.filter = f;
  document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c.dataset.filter === f));
  render();
}

/* ---------- ligação ---------- */
function connMsg(key, args = {}, cls = "") {
  connMsgState = { key, args, cls };
  $("connMsg").className = "conn-msg " + cls;
  if (key === "conn_hint") $("connMsg").innerHTML = t(key);   // texto da tradução, com <b>
  else $("connMsg").textContent = t(key, args);
}

$("btnTest").onclick = async () => {
  const c = conn(); if (!c) return;
  $("btnTest").disabled = true;
  connMsg("testing");
  $("connDot").className = "dot busy";
  const r = await api().test_connection(c.ip, c.port);
  $("btnTest").disabled = state.busy;
  $("connDot").className = "dot " + (r.ok ? "ok" : "err");
  connMsg(r.key, r.args, r.ok ? "ok" : "err");
};

$("btnFind").onclick = async () => {
  const port = $("port").value.trim() || "1337";
  const box = $("vitaFound");
  $("btnFind").disabled = true;
  connMsg("searching_net");
  box.replaceChildren();
  const list = await api().find_vita(port);
  $("btnFind").disabled = state.busy;
  if (!list.length) { connMsg("find_none", { port }, "err"); return; }
  connMsg(list.length === 1 ? "found_one" : "found_many", {}, "ok");
  for (const f of list) {
    const b = el("button");
    b.append(el("code", null, f.ip), el("span", null, f.vita ? "PS Vita" : (f.banner || "FTP").slice(0, 28)));
    b.onclick = () => { $("ip").value = f.ip; box.replaceChildren(); connMsg("ip_filled", {}, "ok"); };
    box.append(b);
  }
};

/* ---------- definições ---------- */
function applyInit(init) {
  config = init.config;
  state.excluded = new Set(config.excluded || []);
  setGames(init.games);
  state.results.clear();
  state.details = {};
  state.lastSync = init.last_sync;
  if (state.view !== "library") closeGame();
  if (init.pc_dir_ok) setStatus("ready");
  else setStatus("choose_pc_dir", {}, "err");
  setLanguage(config.language);
}

function setErr(id, key) {
  $(id).classList.toggle("bad", !!key);
  $(id).querySelector(".err").textContent = key ? t(key) : "";
}

function openSettings() {
  $("pcDir").value = config.pc_dir || "";
  $("backupDir").value = config.backup_dir || "";
  $("vitaDir").value = config.vita_dir || "/ux0:/pspemu/PSP/SAVEDATA";
  $("keepBackups").value = config.keep_backups ?? 10;
  $("langSelect").value = config.language || "";
  const cf = document.querySelector(`input[name=confirm][value="${config.confirm || "checked"}"]`);
  if (cf) cf.checked = true;
  ["setPc", "setBackup", "setVita", "setKeep"].forEach((id) => setErr(id, null));
  $("found").replaceChildren();
  $("settings").classList.add("show");
}
const closeSettings = () => $("settings").classList.remove("show");

// O idioma aplica-se logo ao escolher (e fica guardado), sem esperar por "Guardar".
$("langSelect").onchange = async () => {
  config.language = await api().set_language($("langSelect").value);
  setLanguage(config.language);
};

async function detect() {
  const box = $("found");
  box.replaceChildren(el("div", "none", t("searching")));
  const list = await api().detect_ppsspp();
  box.replaceChildren();
  if (!list.length) { box.append(el("div", "none", t("ppsspp_not_found"))); return; }
  for (const f of list) {
    const b = el("button");
    b.append(el("code", null, f.path), el("span", null, tn("n_saves", f.saves)));
    b.onclick = () => { $("pcDir").value = f.path; box.replaceChildren(); };
    box.append(b);
  }
}

async function saveSettings() {
  const confirmMode = document.querySelector("input[name=confirm]:checked")?.value || "checked";
  const res = await api().save_settings($("pcDir").value, $("backupDir").value, $("vitaDir").value,
                                        $("keepBackups").value, confirmMode);
  if (!res.ok) {
    setErr({ pc_dir: "setPc", vita_dir: "setVita", keep_backups: "setKeep" }[res.field] || "setPc", res.key);
    if (res.field === "vita_dir") document.querySelector("#settings details").open = true;
    return;
  }
  applyInit(res);
  closeSettings();
  toast(t("settings_saved"));
}

$("btnSettings").onclick = openSettings;
$("btnCancel").onclick = closeSettings;
$("btnSave").onclick = saveSettings;
$("btnDetect").onclick = detect;
for (const id of ["settings", "preview", "confirm"])
  // (nunca devolver false num onclick: isso cancelaria cliques em caixas e opções lá dentro)
  $(id).addEventListener("click", (e) => {
    if (e.target.id !== id || id === "preview") return;
    if (id === "settings") closeSettings(); else closeConfirm();
  });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("confirm").classList.contains("show")) closeConfirm();
  else if ($("preview").classList.contains("show")) $("pvCancel").click();
  else if ($("settings").classList.contains("show")) closeSettings();
  else if (state.view !== "library") closeGame();
});
$("btnBack").onclick = closeGame;
$("btnBackupsBack").onclick = closeGame;
$("btnSyncGame").onclick = () => {
  const g = groups().find((x) => x.code === state.openGame);
  if (g) preview(state.mode, g.saves.map((s) => s.id));
};
document.querySelectorAll("[data-browse]").forEach((b) => (b.onclick = async () => {
  const input = $(b.dataset.browse);
  const path = await api().browse_folder(input.value);
  if (path) input.value = path;
}));

/* ---------- arranque ---------- */
LANG = pickLanguage("");
applyStaticI18n();
$("syncLabel").textContent = t("sync");
setStatus("ready");

window.addEventListener("pywebviewready", async () => {
  const init = await api().get_initial();
  $("ip").value = init.config.ip || "";
  $("port").value = init.config.port || "1337";
  setMode(init.config.mode || "auto");
  $("grid").classList.add("intro");
  applyInit(init);
  setTimeout(() => $("grid").classList.remove("intro"), 600);
  if (!init.pc_dir_ok) { openSettings(); detect(); }
});

document.querySelectorAll(".mode").forEach((b) => (b.onclick = () => setMode(b.dataset.mode)));
document.querySelectorAll(".chip").forEach((c) => (c.onclick = () => setFilter(c.dataset.filter)));
$("syncBtn").onclick = () => preview(state.mode);
$("search").oninput = (e) => { state.query = e.target.value; render(); };
for (const id of ["ip", "port"])
  $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") preview(state.mode); });
$("logToggle").onclick = () => $("log").classList.toggle("open");
$("openPc").onclick = () => api().open_folder("pc");
$("openBackup").onclick = openBackups;
$("openBackupFolder").onclick = () => api().open_folder("backup");
</script>
</body>
</html>
